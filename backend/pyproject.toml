[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-os-backend"
version = "0.1.0"
description = "Health OS backend."
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "django-cors-headers>=4.4,<5.0",
    "django-environ>=0.11,<1.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "django-stubs>=5.1,<6.0",
    "djangorestframework-stubs>=3.15,<4.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "health_os*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["."]
addopts = "-ra --cov=health_os --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["health_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.13"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
strict = true
mypy_path = "."
exclude = [
    ".venv",
    ".*/migrations/.*",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = [
    "drf_spectacular.*",
    "environ.*",
]
ignore_missing_imports = true
